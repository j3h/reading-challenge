<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="940" height="400" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#233b77"/></marker></defs>
<text x="130" y="30" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">1. The printed stack</text>
<text x="130" y="50" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">4 sheets, 8 certificates (sheet 1 on top)</text>
<rect x="178" y="146" width="54" height="72" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<line x1="172" y1="182.0" x2="238" y2="182.0" stroke="#c2570c" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="205.0" y="170.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">4</text>
<text x="205.0" y="206.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">8</text>
<rect x="132" y="124" width="54" height="72" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<line x1="126" y1="160.0" x2="192" y2="160.0" stroke="#c2570c" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="159.0" y="148.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">3</text>
<text x="159.0" y="184.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">7</text>
<rect x="86" y="102" width="54" height="72" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<line x1="80" y1="138.0" x2="146" y2="138.0" stroke="#c2570c" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="113.0" y="126.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">2</text>
<text x="113.0" y="162.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">6</text>
<rect x="40" y="80" width="54" height="72" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<line x1="34" y1="116.0" x2="100" y2="116.0" stroke="#c2570c" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="67.0" y="104.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">1</text>
<text x="67.0" y="140.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">5</text>
<text x="130" y="290" font-size="12" font-weight="normal" fill="#c2570c" text-anchor="middle">Cut along the dashed middle line</text>
<text x="130" y="308" font-size="12" font-weight="normal" fill="#c2570c" text-anchor="middle">(the little marks at the sheet edges).</text>
<text x="130" y="334" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">Too thick? Cut sheets 1–2 first,</text>
<text x="130" y="352" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">then sheets 3–4 (any batch size works).</text>
<line x1="265" y1="170" x2="325" y2="170" stroke="#233b77" stroke-width="2" marker-end="url(#arr)"/>
<text x="470" y="30" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">2. Two piles, in order</text>
<text x="470" y="50" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">each batch goes under the one before</text>
<text x="410" y="80" font-size="12" font-weight="bold" fill="#233b77" text-anchor="middle">top halves</text>
<text x="530" y="80" font-size="12" font-weight="bold" fill="#20b2a8" text-anchor="middle">bottom halves</text>
<rect x="383" y="90" width="54" height="34" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="410.0" y="113.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">1</text>
<rect x="503" y="90" width="54" height="34" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="530.0" y="113.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">5</text>
<rect x="383" y="130" width="54" height="34" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="410.0" y="153.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">2</text>
<rect x="503" y="130" width="54" height="34" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="530.0" y="153.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">6</text>
<rect x="383" y="170" width="54" height="34" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="410.0" y="193.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">3</text>
<rect x="503" y="170" width="54" height="34" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="530.0" y="193.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">7</text>
<rect x="383" y="210" width="54" height="34" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="410.0" y="233.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">4</text>
<rect x="503" y="210" width="54" height="34" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="530.0" y="233.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">8</text>
<text x="410" y="270" font-size="11" font-weight="normal" fill="#8a8f99" text-anchor="middle">1 on top</text>
<text x="530" y="270" font-size="11" font-weight="normal" fill="#8a8f99" text-anchor="middle">5 on top</text>
<line x1="615" y1="170" x2="675" y2="170" stroke="#233b77" stroke-width="2" marker-end="url(#arr)"/>
<text x="810" y="30" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">3. Bottom pile under top pile</text>
<text x="810" y="50" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">= the order of the class lists</text>
<rect x="783" y="66" width="54" height="30" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="810.0" y="87.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">1</text>
<rect x="783" y="102" width="54" height="30" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="810.0" y="123.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">2</text>
<rect x="783" y="138" width="54" height="30" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="810.0" y="159.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">3</text>
<rect x="783" y="174" width="54" height="30" rx="3" fill="#fff" stroke="#233b77" stroke-width="1.5"/>
<text x="810.0" y="195.0" font-size="16" font-weight="bold" fill="#233b77" text-anchor="middle">4</text>
<rect x="783" y="210" width="54" height="30" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="810.0" y="231.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">5</text>
<rect x="783" y="246" width="54" height="30" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="810.0" y="267.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">6</text>
<rect x="783" y="282" width="54" height="30" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="810.0" y="303.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">7</text>
<rect x="783" y="318" width="54" height="30" rx="3" fill="#fff" stroke="#20b2a8" stroke-width="1.5"/>
<text x="810.0" y="339.0" font-size="16" font-weight="bold" fill="#20b2a8" text-anchor="middle">8</text>
<text x="810" y="368" font-size="11" font-weight="normal" fill="#8a8f99" text-anchor="middle">1 on top … 8 at the bottom</text>
<text x="470" y="330" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">Then trim the edges: the grey margin label</text>
<text x="470" y="348" font-size="12" font-weight="normal" fill="#8a8f99" text-anchor="middle">(e.g. “5 of 8 · Hunt 2 of 3”) comes off.</text>
</svg>
