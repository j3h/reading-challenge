<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Challenge review (table)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
  /* Colours and type from the BCS PTA Reading Challenge page (beverlyclearyschool.org/reading-challenge):
     navy #233B77 bar, blue #246CBA / #008AC6 headings and links, teal #20B2A8 from the Reading Challenge badge,
     Montserrat headings, Open Sans text. The fonts fall back to the system font when offline. */
  :root {
    --navy: #233b77; --navy-ink: #ffffff; --teal: #20b2a8;
    --bg: #f4f7fb; --panel: #ffffff; --ink: #1f2937; --muted: #5a5a5a; --line: #dce3ee; --row: #f7f9fc;
    --accent: #246cba; --accent-ink: #ffffff; --link: #008ac6; --open: #c2570c; --auto: #17917f; --decided: #246cba; --skip: #8a8a90;
    --warn-bg: #fff4e5; --info-bg: #eef3f9; --sel: #e6f1fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --navy: #1a2c5a; --navy-ink: #ffffff; --teal: #3cc7bc;
            --bg: #121722; --panel: #1b2230; --ink: #e8edf5; --muted: #a3adbd; --line: #2e384a; --row: #202838;
            --accent: #5b9be0; --accent-ink: #0d1420; --link: #4fb6e6; --open: #f0a05a; --auto: #4fd1c0; --decided: #7cb1ee; --skip: #8a8a92;
            --warn-bg: #3a2c1c; --info-bg: #222c3d; --sel: #1d3350; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1, h2, th, button, .st, .counts { font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 0; }
  a { color: var(--link); }
  header { position: sticky; top: 0; z-index: 5; background: var(--navy); color: var(--navy-ink); border-bottom: 4px solid var(--teal);
           padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header .badge { font: 700 11px Montserrat, sans-serif; letter-spacing: .08em; text-transform: uppercase; background: var(--teal);
                  color: #fff; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header a.home { color: var(--navy-ink); text-decoration: none; font: 600 13px Montserrat, sans-serif; opacity: .85; }
  header a.home:hover { opacity: 1; text-decoration: underline; }
  header .counts { flex: 1; color: rgba(255,255,255,.8); font-size: 13px; }
  header button { background: transparent; color: var(--navy-ink); border-color: rgba(255,255,255,.45); }
  header button:hover:not(:disabled) { border-color: #fff; background: rgba(255,255,255,.1); }
  header button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  header button.primary:hover:not(:disabled) { background: var(--teal); filter: brightness(1.08); }
  .bar { display: flex; gap: 14px; align-items: center; padding: 8px 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .wrap { padding: 0 16px 40px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--accent); padding: 8px 10px; border-bottom: 2px solid var(--line); background: var(--row); text-transform: uppercase; letter-spacing: .04em; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--row); }
  tr.row.sel td { background: var(--sel); }
  tr.row.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
  .st::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .st.open { --c: var(--open); color: var(--open); font-weight: 600; } .st.auto { --c: var(--auto); }
  .st.decided { --c: var(--decided); } .st.skipped, .st.held { --c: var(--skip); color: var(--muted); }
  .muted { color: var(--muted); }
  .unsure { color: var(--open); font-weight: 600; }
  .why { font-size: 12px; color: var(--open); }
  table { table-layout: fixed; }
  col.c-st { width: 118px; } col.c-pg { width: 46px; } col.c-name { width: 17%; } col.c-stu { width: 23%; }
  col.c-tea { width: 17%; } col.c-pp { width: 15%; }
  tr.row.sel td { vertical-align: top; padding-bottom: 12px; }
  td .stack { display: flex; flex-direction: column; gap: 6px; }
  td .stack > select, td .stack > input { width: 100%; }
  img.snip { display: block; max-width: 100%; max-height: 64px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: zoom-in; }
  img.snip.big { max-height: 220px; cursor: zoom-out; }
  td.num input { text-align: right; }
  .grid { display: grid; grid-template-columns: 70px 1fr; gap: 7px 10px; align-items: center; }
  .grid label { color: var(--muted); font-size: 13px; }
  .grid .full { display: flex; gap: 6px; flex-wrap: wrap; }
  .grid .full > * { flex: 1; }
  .box { border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 13px; }
  .box.why { background: var(--warn-bg); color: var(--ink); }
  .box.info { background: var(--info-bg); color: var(--muted); }
  .box ul { margin: 2px 0 0; padding-left: 18px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12px; }
  .box.dup { text-align: left; display: flex; flex-direction: column; gap: 6px; margin: 0; }
  .box.dup { padding: 6px 8px; }
  .box.dup label { display: flex; gap: 5px; align-items: center; white-space: nowrap; cursor: pointer; }
  .box.dup input { margin: 0; flex: none; }
  .box.dup label b { margin-left: auto; font-variant-numeric: tabular-nums; }
  tr.bar-row td { background: var(--sel); padding: 0 10px 10px; border-bottom: 1px solid var(--line); }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 8px; border-top: 1px dashed var(--line); }
  .ctl u { text-decoration-thickness: 2px; text-underline-offset: 2px; }
  tr.sheet td { background: var(--sel); padding: 0 10px 14px; }
  tr.sheet img { display: block; width: 100%; max-width: 900px; margin: 0 auto; border: 1px solid var(--line); border-radius: 8px; }
  .files { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 16px; margin: 12px 0; }
  .files h2 { font-size: 18px; font-weight: 600; color: var(--link); margin: 10px 0 4px; }
  .file { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); }
  .file a { font-weight: 600; }
  pre.summary { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #error { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #b3261e; color: #fff;
           padding: 10px 16px; border-radius: 10px; display: none; max-width: 80vw; z-index: 10; }
</style>
</head>
<body>
<header>
  <a id="home" class="home" href="/" hidden>← Home</a>
  <span class="badge">BCS PTA</span>
  <h1 id="title">Reading Challenge review</h1>
  <div class="counts" id="counts"></div>
  <button id="acceptAll"></button>
  <button id="finish" class="primary" disabled>Finish month</button>
</header>
<div class="bar">
  <label><input type="checkbox" id="onlyOpen"> only rows that need a look</label>
  <span><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> accept row &amp; go to next that needs a look · <kbd>A</kbd> accept · <kbd>S</kbd> skip · <kbd>H</kbd> hold for later · <kbd>R</kbd> reset · <kbd>W</kbd> whole sheet (with <kbd>Alt</kbd> while typing) · <kbd>Esc</kbd> close row</span>
</div>
<div class="wrap" id="app"><p class="hint">Loading the sheets…</p></div>
<div id="error"></div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const MONTH = new URLSearchParams(location.search).get("m");          // set when opened from the app's home screen
const AUTH = "t=" + TOKEN + (MONTH ? "&m=" + encodeURIComponent(MONTH) : "");
let state = null, selected = null, form = null, onlyOpen = false, showSheet = false;
const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...kids) {              // text only: nothing read from handwriting is ever parsed as HTML
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null && v !== "") e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function fail(msg) { const e = $("error"); e.textContent = msg; e.style.display = "block"; setTimeout(() => e.style.display = "none", 6000); }
async function api(path, body) {
  const res = await fetch(path + (path.includes("?") ? "&" : "?") + AUTH, body === undefined ? {} :
    { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const fmt = (n) => (n == null || n === "" ? "?" : Number(n).toLocaleString());
const sheet = () => state.sheets.find((s) => s.key === selected);
const visible = () => state.sheets.filter((s) => !onlyOpen || s.status === "open" || s.key === selected);
const label = { open: "needs a look", auto: "automatic", decided: "accepted", skipped: "skipped", held: "held for later" };
const nextOpen = (fromKey) => { const list = state.sheets, n = list.length, at = list.findIndex((s) => s.key === fromKey);
  for (let i = 1; i <= n; i++) { const s = list[(at + i) % n]; if (s.status === "open") return s; } return null; };

async function load() {
  try { state = await api("/api/state"); } catch (e) { return fail(e.message); }
  if (!state.finished && !state.sheets.some((s) => s.key === selected)) selected = (state.sheets.find((s) => s.status === "open") || {}).key || null;
  render();
}
function open(key) { selected = selected === key ? null : key; form = null; render(); scrollToSel(); }
function scrollToSel() { const r = document.querySelector("tr.row.sel"); if (r) r.scrollIntoView({ block: "nearest" }); }

async function save(decision, advance) {
  const from = selected;
  try { state = await api("/api/decision", { key: from, decision }); } catch (e) { return fail(e.message); }
  form = null;
  const still = state.sheets && state.sheets.find((x) => x.key === from);
  // stay on the sheet if it still has a question (e.g. it turned out to be this child's second sheet)
  if (advance && !(still && still.status === "open")) { const n = nextOpen(from); selected = n ? n.key : null; }
  render(); scrollToSel();
}

// ---------------------------------------------------------------- what each row says, closed
function studentCell(s) {
  const f = s.form;
  if (s.status === "skipped") return el("span", { class: "muted" }, s.outcome);
  if (s.status === "held" && !f.mode) return el("span", { class: "muted" }, s.outcome);
  if (f.mode === "student") { const p = state.roster.find((x) => x.id === f.student);
    return p ? el("span", {}, p.name, p.new_from ? el("span", { class: "muted" }, ` (new, ${p.new_from})`) : "") : "?"; }
  if (f.mode === "new") return el("span", {}, f.new.name || "?", el("span", { class: "muted" }, " (new)"));
  return el("span", { class: "muted" }, "?");
}

function render() {
  if (state.finished) return renderFinished();
  const c = state.counts;
  $("title").textContent = state.pool ? `Inbox · next round: ${state.round_label}` : "Review: " + state.month;
  $("counts").textContent = `${state.sheets.length} sheets · ${c.open} need a look · ${c.auto} automatic · ${c.decided} accepted · ${c.skipped} skipped`
    + (state.pool ? ` · ${c.held} held` : "");
  $("acceptAll").textContent = `Accept all suggestions (${state.acceptable})`; $("acceptAll").disabled = !state.acceptable;
  $("finish").disabled = !state.ready;
  if (state.pool) $("finish").textContent = `Print round (${state.round.children} certificate${state.round.children === 1 ? "" : "s"})`;
  const body = el("tbody");
  for (const s of visible()) {
    body.append(s.key === selected ? openRow(s) : closedRow(s));
    if (s.key === selected) body.append(controlBar(s));
    if (s.key === selected && showSheet && !s.read.form) body.append(el("tr", { class: "sheet" }, el("td", { colspan: 7 },
      el("img", { src: "/scan?key=" + encodeURIComponent(s.key) + "&" + AUTH, alt: "Scanned sheet " + s.label }))));
  }
  $("app").replaceChildren(el("table", {},
    el("colgroup", {}, ["c-st", "c-pg", "c-name", "c-stu", "c-tea", "c-pp", "c-chk"].map((c) => el("col", { class: c }))),
    el("thead", {}, el("tr", {}, ["Status", "Page", "Name on sheet", "Student", "Teacher", "Pages", "Check"].map((h) => el("th", {}, h)))), body));
}

function closedRow(s) {
  const r = s.read;
  return el("tr", { class: "row", onclick: () => open(s.key) },
    el("td", {}, el("span", { class: "st " + s.status }, label[s.status])),
    el("td", { class: "muted", title: s.read.form ? "row in " + s.file : s.file }, s.read.form ? "form " + s.page : s.page),
    el("td", {}, r.name || "(no name)", r.confidence !== "high" ? el("span", { class: "unsure" }, " ?") : ""),
    el("td", {}, studentCell(s)),
    el("td", {}, s.status === "skipped" ? "" : (s.form.teacher || (s.status === "held" ? "" : el("span", { class: "why" }, "choose")))),
    el("td", { class: "num" }, s.status === "skipped" ? "" : fmt(s.form.pages), r.pages_confidence !== "high" && s.status !== "skipped" ? el("span", { class: "unsure" }, " ?") : ""),
    el("td", {}, s.status === "open" ? el("span", { class: "why" }, shortPages(s.reasons.join(" · ")))
      : el("span", { class: "muted" }, s.duplicate && s.status !== "skipped" ? shortPages(s.outcome) : (s.warnings[0] || ""))));
}

// ---------------------------------------------------------------- actions (buttons in the bar under the open row, and keys)
// Each has a one-letter key (underlined). Alt+letter works while typing in a field; the plain letter works otherwise.
const ACTIONS = {
  KeyA: () => accept(),
  KeyS: () => { const s = sheet(); if (s && s.status !== "skipped") save({ skip: "skipped" }, true); },
  KeyR: () => { const s = sheet(); if (s && Object.keys(s.decision).length && confirm(s.status === "skipped" ? "Un-skip this sheet?" : "Forget what was chosen for this sheet and go back to the suggestion?")) save({}, false); },
  KeyW: () => { showSheet = !showSheet; render(); },
  KeyH: () => { const s = sheet(); if (!s || !state.pool) return;
    if (s.status === "held") { const d = { ...s.decision }; delete d.hold; save(d, false); }
    else save({ ...s.decision, hold: true, ...(s.repeat ? { repeat_ok: true } : {}) }, true); },   // held = real reading, counted later
};
function keyed(text, letter) {           // "Skip" + "S" -> S̲kip, with the letter underlined
  const i = text.toLowerCase().indexOf(letter.toLowerCase());
  return i < 0 ? [text] : [text.slice(0, i), el("u", {}, text[i]), text.slice(i + 1)];
}
function controlBar(s) {
  const btn = (code, text, attrs = {}) => el("button", { ...attrs, title: `${text} (${code.slice(3)}, or Alt+${code.slice(3)} while typing)`,
    onclick: (e) => { e.stopPropagation(); ACTIONS[code](); } }, ...keyed(text, code.slice(3)));
  const decided = Object.keys(s.decision).length > 0;
  const left = s.status === "held"
    ? [btn("KeyH", "Bring back for this round", { class: "primary" })]
    : s.status === "skipped"
    ? [btn("KeyR", "Restore (un-skip)", { class: "primary" })]
    : [btn("KeyA", s.status === "open" ? "Accept" : "Save", { class: "primary", id: "accept" }), el("span", { class: "hint" }, "or Enter"),
       btn("KeyS", "Skip sheet"), state.pool ? btn("KeyH", "Hold for a later round") : null,
       decided ? btn("KeyR", "Reset to suggestion") : null];
  return el("tr", { class: "bar-row" }, el("td", { colspan: 7 }, el("div", { class: "ctl" },
    ...left, el("span", { style: "flex:1" }), el("span", { class: "hint" }, s.label),
    s.read.form ? el("span", { class: "hint" }, "typed in the Google Form: no scan") : btn("KeyW", showSheet ? "▾ Hide whole sheet" : "▸ Whole sheet"))));
}

// "Reading Challenge Sheets October 2026.pdf p. 3" -> "p. 3" (only one scan file per month, usually)
const shortPages = (text) => [...new Set(state.sheets.map((x) => x.file))].reduce((t, f) => t.split(f + " ").join(""), String(text));

// another sheet for a child who already has one this month: add / replace / skip, with what each gives
function dupChoice(s, f) {
  const d = s.duplicate, others = shortPages(d.others.join(", ")), mine = f.pages == null ? null : Number(f.pages);
  const so = d.so_far;
  const opts = [["sum", "Add", so == null || mine == null ? "?" : fmt(so + mine), "add this sheet's pages to " + others],
                ["replace", "Replace", fmt(mine), "use only this sheet's pages (its total already includes " + others + ")"],
                ["skip", "Skip", fmt(so), "same sheet as " + others + ": ignore this one"]];
  const name = "dup-" + s.key;
  return el("div", { class: "box why dup" }, el("div", {}, `Also ${others}: ${fmt(so)}`),
    opts.map(([v, text, total, title]) => el("label", { title },
      el("input", { type: "radio", name, value: v, checked: (f.duplicate || "sum") === v,
                    onchange: () => { f.duplicate = v; } }), ` ${text} `, el("b", {}, total))));
}

function snip(s, field) {     // the handwriting a value was read from, right under the value
  if (!s.read.boxes.includes(field)) return null;
  const img = el("img", { class: "snip", alt: "", title: "What the sheet says (click to enlarge)",
    src: `/crop?key=${encodeURIComponent(s.key)}&field=${field}&${AUTH}`, onclick: (e) => { e.stopPropagation(); e.target.classList.toggle("big"); } });
  img.addEventListener("error", () => img.remove());
  return img;
}

// ---------------------------------------------------------------- the open row: every value edited in its own column
function openRow(s) {
  const r = s.read, stop = (e) => e.stopPropagation();
  if (!form) form = JSON.parse(JSON.stringify(s.form));
  const f = form;
  const statusCell = el("td", {}, el("span", { class: "st " + s.status }, label[s.status]));
  const nameCell = el("td", {}, el("div", { class: "stack" },
    el("span", {}, r.name || "(no name)", r.confidence !== "high" ? el("span", { class: "unsure" }, " ?") : ""), snip(s, "name"),
    r.note ? el("span", { class: "hint" }, r.note) : null));
  const checkCell = el("td", {}, el("div", { class: "stack" },
    s.status === "open" && s.reasons.length ? el("div", { class: "box why" }, el("ul", {}, s.reasons.map((x) => el("li", {}, shortPages(x))))) : null,
    ...s.warnings.map((w) => el("div", { class: "box info" }, w)), snip(s, "month")));
  if (s.status === "skipped" || s.status === "held") {
    checkCell.firstChild.append(el("div", { class: "box info" }, s.outcome));
    return el("tr", { class: "row sel", onclick: () => open(s.key) }, statusCell, el("td", { class: "muted", title: s.read.form ? "row in " + s.file : s.file }, s.read.form ? "form " + s.page : s.page), nameCell,
      el("td"), el("td"), el("td"), checkCell);
  }
  // student
  const cands = s.candidates;
  const who = el("select", { onchange: (e) => {
    const v = e.target.value;
    if (v === "__new") f.mode = "new";
    else { f.mode = "student"; f.student = v; const p = state.roster.find((x) => x.id === v); f.teacher = p ? p.teacher : ""; }
    render();
  } });
  const options = [...cands];
  if (f.mode === "student" && f.student && !options.some((c) => c.id === f.student)) {
    const p = state.roster.find((x) => x.id === f.student); if (p) options.unshift({ ...p });
  }
  for (const c of options) who.append(el("option", { value: c.id, selected: f.mode === "student" && f.student === c.id },
    c.new_from ? `${c.name} · ${c.teacher || "no teacher"} · new, from ${c.new_from}`
               : `${c.name} · ${c.teacher || "no teacher"}${c.grade ? " · gr " + c.grade : ""} · ${fmt(c.total)} pp`));
  who.append(el("option", { value: "__new", selected: f.mode !== "student" }, "New student…"));
  const finder = el("input", { list: "rosterlist", placeholder: "Find on roster…" });
  finder.addEventListener("change", () => {
    const p = state.roster.find((x) => `${x.name} (${x.teacher || "no teacher"})` === finder.value);
    if (p) { f.mode = "student"; f.student = p.id; f.teacher = p.teacher; render(); }
  });
  const studentStack = el("div", { class: "stack" }, who);
  if (f.mode !== "student") {
    studentStack.append(el("input", { value: f.new.name, placeholder: "Full name", oninput: (e) => f.new.name = e.target.value }),
      el("input", { value: f.new.grade, placeholder: "Grade", oninput: (e) => f.new.grade = e.target.value }));
    if (f.new.name && !f.new.name.trim().includes(" ")) studentStack.append(el("span", { class: "hint" }, "Only a first name: the certificate will print just this."));
  }
  studentStack.append(finder, el("datalist", { id: "rosterlist" }, state.roster.map((p) => el("option", { value: `${p.name} (${p.teacher || "no teacher"})` }))));
  const pickedNew = f.mode === "student" && (state.roster.find((x) => x.id === f.student) || {}).new_from;
  const picked = f.mode === "student" && state.roster.find((x) => x.id === f.student);
  if (picked && !picked.new_from) studentStack.append(el("div", { class: "hint" },
    picked.recent.length ? picked.recent.map(([m, n]) => `${m}: ${fmt(n)}`).join(" · ") : "no earlier sheets",
    ` · total ${fmt(picked.total)} · `,
    MONTH ? el("a", { href: "/#student=" + encodeURIComponent(picked.id), target: "_blank", rel: "noopener" }, "History →") : null));
  if (f.mode === "student" && r.name && !pickedNew) {
    const p = state.roster.find((x) => x.id === f.student);
    if (p && p.name.toLowerCase() !== r.name.trim().toLowerCase())
      studentStack.append(el("label", { class: "hint" }, el("input", { type: "checkbox", checked: !!f.remember_name, onchange: (e) => f.remember_name = e.target.checked }), ` recognise "${r.name}" next time`));
  }
  // teacher
  const isOther = f.otherTeacher || (f.teacher && !state.teachers.includes(f.teacher));
  const teacherStack = el("div", { class: "stack" }, el("select", { disabled: !!pickedNew, title: pickedNew ? `Set on ${pickedNew}, where they were added` : "",
      onchange: (e) => { f.otherTeacher = e.target.value === "__other"; f.teacher = f.otherTeacher ? "" : e.target.value;
        const g = (state.teacher_grades || {})[f.teacher];      // a new student takes the class's grade
        if (f.mode !== "student" && g && !String(f.new.grade || "").trim()) f.new.grade = g;
        render(); } },
    el("option", { value: "" }, "Choose…"),
    state.teachers.map((t) => el("option", { value: t, selected: !isOther && t === f.teacher }, t)),
    el("option", { value: "__other", selected: isOther }, "Someone else…")),
    isOther ? el("input", { value: f.teacher, placeholder: "Teacher's name", oninput: (e) => f.teacher = e.target.value }) : null,
    snip(s, "teacher"));
  // pages
  const pagesStack = el("div", { class: "stack" },
    el("input", { type: "number", min: 0, value: f.pages ?? "", oninput: (e) => f.pages = e.target.value === "" ? null : Number(e.target.value),
      onchange: () => s.duplicate && render() }),
    snip(s, "total"), s.duplicate ? dupChoice(s, f) : null);
  const editable = (child) => el("td", { onclick: stop }, child);
  return el("tr", { class: "row sel", onclick: () => open(s.key) }, statusCell, el("td", { class: "muted", title: s.read.form ? "row in " + s.file : s.file }, s.read.form ? "form " + s.page : s.page), nameCell,
    editable(studentStack), editable(teacherStack), el("td", { class: "num", onclick: stop }, pagesStack), editable(checkCell.firstChild));
}


const pickedNewId = (f) => f.mode === "student" && (state.roster.find((x) => x.id === f.student) || {}).new_from;

function accept() {
  const f = form, s = sheet();
  if (!f || !s) return;
  if (f.pages == null || isNaN(f.pages) || f.pages < 0) return fail("Type the number of pages.");
  if (!String(f.teacher || "").trim()) return fail("Choose a teacher.");
  let d;
  if (f.mode === "student") {
    const p = state.roster.find((x) => x.id === f.student);
    d = { student: f.student, remember_name: !!f.remember_name, pages: Number(f.pages) };
    if (p && f.teacher.trim() !== p.teacher) d.teacher = f.teacher.trim();
  } else {
    if (!f.new.name.trim()) return fail("Type the child's name.");
    d = { new_student: { name: f.new.name.trim(), teacher: f.teacher.trim(), grade: f.new.grade.trim() }, pages: Number(f.pages) };
  }
  if (s.duplicate) d.duplicate = f.duplicate || "sum";
  if (s.repeat) d.repeat_ok = true;              // the child already has pages for that month: counted anyway, on purpose
  if (pickedNewId(f)) delete d.teacher;
  save(d, true);
}

function renderFinished() {
  $("title").textContent = "Finished: " + state.month; $("counts").textContent = "";
  $("finish").style.display = $("acceptAll").style.display = "none";
  document.querySelector(".bar").style.display = "none";
  const open = (file) => api("/api/open", { file }).catch((e) => fail(e.message));
  const what = { certificates: "The one file to print: class lists for bagging first, then the certificates 2 per sheet (cut each class's stack once, bottom pile under the top)",
                 checkpoint: "Students and totals (next month starts here)",
                 summary: "What changed this month" };
  const rows = Object.entries(state.files).map(([k, path]) => {
    const name = path.split("/").pop();
    return el("div", { class: "file" },
      el("div", {}, el("a", { href: `/file/${encodeURIComponent(name)}?${AUTH}`, target: "_blank", rel: "noopener" }, name),
        el("div", { class: "hint" }, what[k] || "")),
      el("button", { onclick: () => open(name) }, k === "checkpoint" ? "Open in spreadsheet app" : "Open in app"));
  });
  $("app").replaceChildren(
    el("div", { class: "files" }, el("h2", {}, "This month's files"), ...rows,
      el("div", { class: "file" }, el("div", { class: "hint" }, state.files.certificates.split("/").slice(0, -1).join("/")),
        el("button", { onclick: () => open("folder") }, "Show folder in Finder")),
      MONTH ? el("div", { class: "file" }, el("div", { class: "hint" },
        "Found a mistake? Reopen the month, fix it in review, and finish again. The files above are kept in a dated folder."),
        el("button", { onclick: reopen }, "Reopen month")) : null),
    el("pre", { class: "summary" }, state.summary));
}
async function reopen() {
  const reason = prompt("Reopen " + state.month + "? Its certificates, summary and checkpoint are moved into a dated folder, its changes are cancelled in the history (they stay visible), and you can change any sheet and finish again.\n\nWhy? (kept in the history)");
  if (reason === null) return;
  try { await api("/api/home/reopen", { month: MONTH, reason }); } catch (e) { return fail(e.message); }
  location.reload();
}

if (MONTH) $("home").hidden = false;
$("onlyOpen").addEventListener("change", (e) => { onlyOpen = e.target.checked; render(); });
$("acceptAll").addEventListener("click", async () => {
  if (!confirm(`Accept the suggestion for ${state.acceptable} sheet(s)? You can still change any of them afterwards.`)) return;
  try { state = await api("/api/accept_all", {}); form = null; selected = (state.sheets.find((s) => s.status === "open") || {}).key || null; render(); } catch (e) { fail(e.message); }
});
$("finish").addEventListener("click", async () => {
  if (state.pool) {
    const r = state.round, left = r.open + r.waiting + r.held;
    if (!confirm(`Print ${state.round_label} round ${state.next_round}: ${r.children} certificate(s) from ${r.ready} sheet(s)?` +
      (left ? `\n\n${left} sheet(s) still open, waiting or held stay in the inbox for a later round.` : "") +
      "\n\nThe month can be changed on the home screen. The prizes on its class lists count as handed out.")) return;
    try { await api("/api/finish", {}); location.href = "/"; } catch (e) { fail(e.message); }
    return;
  }
  if (!confirm("Finish " + state.month + "? This writes the certificates and the new checkpoint.")) return;
  try { state = await api("/api/finish", {}); render(); } catch (e) { fail(e.message); }
});
document.addEventListener("keydown", (e) => {
  if (!state || state.finished || e.metaKey || e.ctrlKey) return;
  const tag = document.activeElement.tagName, typing = ["INPUT", "SELECT", "TEXTAREA"].includes(tag);
  if (selected && ACTIONS[e.code] && (e.altKey || !typing) && !e.shiftKey) { e.preventDefault(); ACTIONS[e.code](); return; }
  if (e.altKey) return;
  if (e.key === "Enter" && tag !== "BUTTON" && selected && $("accept")) { e.preventDefault(); accept(); return; }
  if (e.key === "Escape") { selected = null; form = null; showSheet = false; render(); return; }
  if (["INPUT", "SELECT", "TEXTAREA"].includes(tag)) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const list = visible(), at = list.findIndex((s) => s.key === selected);
    const to = e.key === "ArrowDown" ? Math.min(list.length - 1, at + 1) : Math.max(0, at - 1);
    if (list[to]) { selected = list[to].key; form = null; render(); scrollToSel(); }
  }
});
load();
</script>
</body>
</html>
